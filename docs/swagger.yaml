basePath: /api
definitions:
  models.APIResponse:
    properties:
      data: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  models.CreateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
      status:
        type: string
    required:
    - name
    type: object
  models.CreateServiceRequest:
    properties:
      focus:
        type: string
      lang:
        type: string
      name:
        type: string
      project:
        type: integer
    required:
    - name
    - project
    type: object
  models.Project:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
    required:
    - name
    type: object
  models.Service:
    properties:
      created_at:
        type: string
      focus:
        type: string
      id:
        type: integer
      lang:
        type: string
      name:
        type: string
      project:
        type: integer
      updated_at:
        type: string
    required:
    - name
    - project
    type: object
  models.UpdateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
      status:
        type: string
    type: object
  models.UpdateServiceRequest:
    properties:
      focus:
        type: string
      lang:
        type: string
      name:
        type: string
      project:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@lucas-api.com
    name: API Support
    url: http://localhost:8080/support
  description: REST API for project and service management with clean architecture
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://localhost:8080/terms/
  title: Lucas Web API
  version: "1.0"
paths:
  /:
    get:
      consumes:
      - application/json
      description: Get general information about the API
      produces:
      - application/json
      responses:
        "200":
          description: API information retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: API Information
      tags:
      - system
  /api/auth/login-url:
    get:
      description: Returns the OAuth2 login URL with optional redirect parameter
      parameters:
      - description: URL to redirect after login
        in: query
        name: redirect_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Login information
          schema:
            additionalProperties: true
            type: object
      summary: Get login URL
      tags:
      - auth
  /api/auth/status:
    get:
      description: Returns current authentication status and user info if authenticated
      produces:
      - application/json
      responses:
        "200":
          description: Authentication status
          schema:
            additionalProperties: true
            type: object
      summary: Check authentication status
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is healthy and running
      produces:
      - application/json
      responses:
        "200":
          description: Service is healthy
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: Health check
      tags:
      - system
  /project:
    get:
      consumes:
      - application/json
      description: Retrieve all projects from the database
      produces:
      - application/json
      responses:
        "200":
          description: Projects retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Project'
                  type: array
              type: object
        "500":
          description: Failed to retrieve projects
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get all projects
      tags:
      - project
    post:
      consumes:
      - application/json
      description: Create a new project with the provided data
      parameters:
      - description: Project data
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Project created successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Project'
              type: object
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to create project
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Create new project
      tags:
      - project
  /project/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project deleted successfully
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Invalid project ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "409":
          description: Cannot delete project with active services
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to delete project
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Delete project
      tags:
      - project
    get:
      consumes:
      - application/json
      description: Retrieve a specific project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Project'
              type: object
        "400":
          description: Invalid project ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to retrieve project
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get project by ID
      tags:
      - project
    put:
      consumes:
      - application/json
      description: Update an existing project with the provided data
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated project data
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Project updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Project'
              type: object
        "400":
          description: Invalid project ID or request body
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to update project
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Update project
      tags:
      - project
  /project/{id}/services:
    get:
      consumes:
      - application/json
      description: Retrieve all services for a specific project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Project services retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Service'
                  type: array
              type: object
        "400":
          description: Invalid project ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Project not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to retrieve project services
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get services by project ID
      tags:
      - project
  /project/stats:
    get:
      consumes:
      - application/json
      description: Retrieve all projects with additional statistics like service count
      produces:
      - application/json
      responses:
        "200":
          description: Project statistics retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    additionalProperties: true
                    type: object
                  type: array
              type: object
        "500":
          description: Failed to retrieve project statistics
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get projects with statistics
      tags:
      - project
  /services:
    get:
      consumes:
      - application/json
      description: Retrieve all services from the database
      produces:
      - application/json
      responses:
        "200":
          description: Services retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Service'
                  type: array
              type: object
        "500":
          description: Failed to retrieve services
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get all services
      tags:
      - services
    post:
      consumes:
      - application/json
      description: Create a new service with the provided data
      parameters:
      - description: Service data
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/models.CreateServiceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Service created successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Service'
              type: object
        "400":
          description: Invalid request body or validation error
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to create service
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Create new service
      tags:
      - services
  /services/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a service by its ID
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Service deleted successfully
          schema:
            $ref: '#/definitions/models.APIResponse'
        "400":
          description: Invalid service ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Service not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to delete service
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Delete service
      tags:
      - services
    get:
      consumes:
      - application/json
      description: Retrieve a specific service by its ID
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Service retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Service'
              type: object
        "400":
          description: Invalid service ID
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Service not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to retrieve service
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Get service by ID
      tags:
      - services
    put:
      consumes:
      - application/json
      description: Update an existing service with the provided data
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated service data
        in: body
        name: service
        required: true
        schema:
          $ref: '#/definitions/models.UpdateServiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Service updated successfully
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Service'
              type: object
        "400":
          description: Invalid service ID or request body
          schema:
            $ref: '#/definitions/models.APIResponse'
        "404":
          description: Service not found
          schema:
            $ref: '#/definitions/models.APIResponse'
        "500":
          description: Failed to update service
          schema:
            $ref: '#/definitions/models.APIResponse'
      summary: Update service
      tags:
      - services
swagger: "2.0"
